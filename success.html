<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام موفق | آموزشگاه نقاشی بومبو</title>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- برای آیکن‌ها -->
  <style>
    body {
      font-family: 'Lalezar', cursive;
      background: linear-gradient(to bottom right, #00BFA6, #FFD66B);
      margin: 0;
      padding: 0;
      direction: rtl;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
      background: #ffffffdd;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #00BFA6;
      font-size: 36px;
      margin-bottom: 25px;
    }
    p {
      text-align: center;
      font-size: 20px;
      color: #333;
      margin-top: 20px;
    }
    button {
      margin-top: 25px;
      padding: 15px;
      width: 100%;
      background: linear-gradient(to right, #00BFA6, #FFD66B);
      color: white;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    button:hover {
      background: linear-gradient(to left, #00BFA6, #FFD66B);
      transform: translateY(-5px);
    }
    /* Media Queries for responsive design */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 20px;
      }
      h2 {
        font-size: 28px;
      }
      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>آموزشگاه نقاشی بومبو</h2>
    <p>ثبت نام شما با موفقیت انجام شد.</p>
    <button onclick="window.location.href='index.html'">بازگشت به صفحه اصلی</button>
  </div>
</body>
</html>
