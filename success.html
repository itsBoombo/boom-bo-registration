<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام موفق</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #f0fff0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .message {
      background-color: #dff0d8;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 18px;
      color: #3c763d;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>ثبت‌نام شما با موفقیت انجام شد 🎉</h1>
    <p>از ثبت‌نام شما در آموزشگاه نقاشی بومبو سپاسگزاریم.</p>
  </div>
</body>
</html>
