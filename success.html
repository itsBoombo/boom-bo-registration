<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام موفق!</title>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lalezar', cursive;
      background: linear-gradient(to bottom right, #00BFA6, #FFD66B);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      direction: rtl;
    }

    .success-box {
      background: #ffffffdd;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 90%;
      color: #333;
    }

    h1 {
      font-size: 36px;
      color: #00BFA6;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .back-button {
      display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(to right, #00BFA6, #FFD66B);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .back-button:hover {
      background: linear-gradient(to left, #00BFA6, #FFD66B);
      transform: translateY(-4px);
    }
  </style>
</head>
<body>
  <div class="success-box">
    <h1>ثبت‌نام شما با موفقیت انجام شد!</h1>
    <p>با تشکر از ثبت‌نام شما در آموزشگاه نقاشی بومبو 🎨</p>
    <a class="back-button" href="index.html">بازگشت به فرم</a>
  </div>
</body>
</html>
