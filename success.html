<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام با موفقیت انجام شد</title>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #FFD66B;
      font-family: 'Lalezar', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .message {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #00BFA6;
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>به بومبو خوش اومدین!<br> باهاتون تماس می‌گیریم 🎨</h1>
  </div>
</body>
</html>
