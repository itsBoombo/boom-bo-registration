<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فرم ثبت‌نام | آموزشگاه نقاشی بومبو</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      background-image: url('https://your-image-url.com/image.jpg');
      background-size: cover;
      background-position: center;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #4CAF50;
    }
    label {
      display: block;
      margin-bottom: 5px;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    button {
      margin-top: 20px;
      padding: 15px;
      width: 100%;
      background-color: #4CAF50;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>آموزشگاه نقاشی بومبو</h2>
    <form action="https://formspree.io/f/mwpoleoz" method="POST">
      <label for="name">نام و نام خانوادگی:</label>
      <input type="text" id="name" name="name" required>

      <label for="age">سن:</label>
      <input type="number" id="age" name="age" required>

      <label for="phone">شماره تماس:</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="message">توضیحات (اختیاری):</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <input type="hidden" name="_redirect" value="success.html">

      <button type="submit">ارسال فرم</button>
    </form>
  </div>
</body>
</html>
