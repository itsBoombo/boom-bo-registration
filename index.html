<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فرم ثبت‌نام | آموزشگاه نقاشی بومبو</title>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- برای آیکن‌ها -->
  <style>
    body {
      font-family: 'Lalezar', cursive;
      background: linear-gradient(to bottom right, #00BFA6, #FFD66B);
      margin: 0;
      padding: 0;
      direction: rtl;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
      background: #ffffffdd;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 40px; /* فاصله بین فرم و فوتر */
    }
    h2 {
      text-align: center;
      color: #00BFA6;
      font-size: 36px;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-size: 18px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #00BFA6;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      margin-top: 5px;
      transition: all 0.3s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #FFD66B;
      box-shadow: 0 0 10px rgba(255, 214, 107, 0.7);
    }
    .art-tools {
      margin-top: 15px;
      border: 2px dashed #FFD66B;
      padding: 15px;
      border-radius: 12px;
      background-color: #fffaf0;
      width: 100%;
      box-sizing: border-box;
    }
    .art-tools label {
      display: inline-block;
      margin-right: 15px;
      font-size: 16px;
    }
    button {
      margin-top: 25px;
      padding: 15px;
      width: 100%;
      background: linear-gradient(to right, #00BFA6, #FFD66B);
      color: white;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    button:hover {
      background: linear-gradient(to left, #00BFA6, #FFD66B);
      transform: translateY(-5px);
    }
    /* Media Queries for responsive design */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 20px;
      }
      h2 {
        font-size: 28px;
      }
      label {
        font-size: 16px;
      }
      input, select, textarea {
        font-size: 14px;
        padding: 10px;
      }
      .art-tools label {
        display: block;
        margin-bottom: 8px;
      }
    }
    /* فوتر */
    footer {
      width: 100%;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      font-size: 16px;
      color: #333;
    }
    footer a {
      color: #00BFA6;
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.3s ease;
    }
    footer a:hover {
      color: #FFD66B;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>آموزشگاه نقاشی بومبو</h2>
    <form action="https://formspree.io/f/mwpoleoz" method="POST">
      <label for="name"><i class="fa fa-user"></i> نام و نام خانوادگی:</label>
      <input type="text" id="name" name="name" required>

      <label for="age"><i class="fa fa-calendar"></i> سن:</label>
      <select id="age" name="age" required>
        <option value="8-11">8 تا 11 سال</option>
        <option value="12-16">12 تا 16 سال</option>
        <option value="17+">17 سال و بالاتر</option>
      </select>

      <label for="phone"><i class="fa fa-phone"></i> شماره تماس:</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="message"><i class="fa fa-comment"></i> توضیحات (اختیاری):</label>
      <textarea id="message" name="message" rows="3"></textarea>

      <div class="art-tools">
        <label><input type="checkbox" name="tools" value="گواش"> گواش</label>
        <label><input type="checkbox" name="tools" value="مداد رنگی"> مداد رنگی</label>
        <label><input type="checkbox" name="tools" value="آبرنگ"> آبرنگ</label>
        <label><input type="checkbox" name="tools" value="گچ پاستل"> گچ پاستل</label>
        <label><input type="checkbox" name="tools" value="سیاه قلم"> سیاه قلم</label>
      </div>

      <input type="hidden" name="_redirect" value="success.html">

      <button type="submit">ارسال فرم</button>
    </form>
  </div>

  <!-- فوتر با اطلاعات تماس -->
  <footer>
    <div>
      <p>برای اطلاعات بیشتر با ما تماس بگیرید:</p>
      <p>شماره تماس: <a href="tel:+989011139210">09011139210</a></p>
      <p>اینستاگرام: <a href="https://www.instagram.com/itsboombo" target="_blank">itsboombo</a></p>
      <p>تلگرام: <a href="https://www.t.me/itsboombo" target="_blank">itsboombo</a></p>
    </div>
  </footer>
</body>
</html>
