<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فرم ثبت‌نام | آموزشگاه نقاشی بومبو</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #f7f7f7;
      direction: rtl;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 5px;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>آموزشگاه نقاشی بومبو</h2>
    <form action="https://formspree.io/f/mwpoleoz" method="POST">
      <label for="name">نام و نام خانوادگی:</label>
      <input type="text" id="name" name="name" required>

      <label for="age">سن:</label>
      <input type="number" id="age" name="age" required>

      <label for="phone">شماره تماس:</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="message">توضیحات (اختیاری):</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <input type="hidden" name="_redirect" value="success.html">

      <button type="submit">ارسال فرم</button>
    </form>
  </div>
</body>
</html>
